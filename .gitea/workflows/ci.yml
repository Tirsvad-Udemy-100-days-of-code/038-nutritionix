# Continuous integration of the Exercise Tracker (Gitea Actions).
#
# Purpose:  check the Python files, run the tests and publish the code metrics.
# Triggers: a pull request to main, and a push to main.
# Jobs:     quality  - the shared quality checks of TirSystem/github-action
#                      (ruff check, ruff format --check, mypy --strict).
#           tests    - pytest with coverage; the coverage report is uploaded.
#           metrics  - on a push to main only: the shared code metrics workflow
#                      commits three badges to the branch "badges".
# Secrets:  none. The metrics job uses the token of the run.
# Changes outside the repository: the metrics job writes the branch "badges".
# Decision: MIL-001 of docs/project-plan.md. The shared workflows are called at
#           the major tag v2 of the same organisation.
# Host:     Gitea Actions; the features used are checked on a pull request.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    permissions:
      contents: read
    uses: TirSystem/github-action/.gitea/workflows/quality-checks.yml@v2
    with:
      languages: python

  tests:
    name: Tests and coverage
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"

      - name: Install the project with its development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run the tests with coverage
        run: python -m pytest --cov --cov-report=xml --cov-fail-under=90

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage
          path: coverage.xml

  metrics:
    name: Code metrics badges
    if: github.event_name == 'push'
    needs: tests
    permissions:
      contents: write
    uses: TirSystem/github-action/.gitea/workflows/code-metrics.yml@v2
    with:
      coverage-artifact: coverage
      coverage-report: coverage.xml
